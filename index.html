<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Calculadora Anestésica PRO">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Calculadora Anestésica PRO</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        :root {
            --bg-primary: #0f172a; --bg-secondary: #1e293b; --bg-card: #334155;
            --accent-cyan: #06b6d4; --accent-green: #10b981; --accent-purple: #a855f7;
            --accent-pink: #ec4899; --text-primary: #f8fafc; --text-secondary: #94a3b8;
            --success: #22c55e; --warning: #f59e0b; --danger: #ef4444; --apresentacao: #fbbf24;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; padding: 1rem; padding-bottom: 5rem; }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; padding: 1rem 0 1.5rem; border-bottom: 2px solid var(--accent-cyan); margin-bottom: 1.5rem; }
        header.ped-mode { border-bottom-color: var(--accent-pink); }
        header h1 { font-size: 1.3rem; color: var(--accent-cyan); font-weight: 700; }
        header.ped-mode h1 { color: var(--accent-pink); }
        header p { color: var(--text-secondary); font-size: 0.8rem; margin-top: 0.25rem; }
        .card { background: var(--bg-secondary); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
        .card h2 { font-size: 1rem; color: var(--accent-cyan); margin-bottom: 1rem; font-weight: 600; }
        .card h2.ped { color: var(--accent-pink); }
        .form-group { margin-bottom: 0.875rem; }
        label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.375rem; font-weight: 500; }
        input, select { width: 100%; padding: 0.75rem; border: 1px solid var(--bg-card); border-radius: 8px; background: var(--bg-primary); color: var(--text-primary); font-size: 1rem; }
        input:focus, select:focus { outline: none; border-color: var(--accent-cyan); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem; }
        button { width: 100%; padding: 0.875rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
        .btn-primary { background: var(--accent-cyan); color: var(--bg-primary); }
        .btn-primary:active { transform: scale(0.98); }
        .btn-ped { background: var(--accent-pink); color: white; }
        .btn-secondary { background: var(--bg-card); color: var(--text-primary); margin-bottom: 1rem; }
        .mode-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1.25rem; }
        .mode-btn { padding: 1rem; border-radius: 10px; border: 2px solid var(--bg-card); background: var(--bg-secondary); color: var(--text-secondary); font-weight: 600; font-size: 1rem; }
        .mode-btn.active-adulto { border-color: var(--accent-cyan); background: rgba(6, 182, 212, 0.1); color: var(--accent-cyan); }
        .mode-btn.active-ped { border-color: var(--accent-pink); background: rgba(236, 72, 153, 0.1); color: var(--accent-pink); }
        #results, #results-ped { display: none; }
        .result-section { background: var(--bg-secondary); border-radius: 10px; padding: 1rem; margin-bottom: 0.875rem; }
        .result-section h3 { font-size: 0.9rem; color: var(--accent-cyan); margin-bottom: 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--bg-card); font-weight: 600; }
        .result-section h3.ped { color: var(--accent-pink); }
        .result-section h4 { font-size: 0.8rem; color: var(--accent-green); margin: 0.875rem 0 0.5rem; font-weight: 600; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th, td { padding: 0.5rem 0.375rem; text-align: left; border-bottom: 1px solid var(--bg-card); }
        th { color: var(--text-secondary); font-weight: 500; font-size: 0.75rem; }
        .dose { color: var(--accent-green); font-weight: 700; }
        .peso-tipo { color: var(--text-secondary); font-size: 0.7rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(85px, 1fr)); gap: 0.5rem; margin-bottom: 0.75rem; }
        .stat-card { background: var(--bg-card); padding: 0.625rem; border-radius: 8px; text-align: center; }
        .stat-card .value { font-size: 1rem; font-weight: 700; color: var(--accent-cyan); }
        .stat-card .label { font-size: 0.65rem; color: var(--text-secondary); margin-top: 0.125rem; }
        .tabs { display: flex; gap: 0.375rem; margin-bottom: 1rem; overflow-x: auto; padding-bottom: 0.5rem; -webkit-overflow-scrolling: touch; }
        .tabs::-webkit-scrollbar { height: 4px; }
        .tabs::-webkit-scrollbar-track { background: var(--bg-card); border-radius: 2px; }
        .tabs::-webkit-scrollbar-thumb { background: var(--accent-cyan); border-radius: 2px; }
        .tab { padding: 0.5rem 0.75rem; border-radius: 6px; background: var(--bg-card); color: var(--text-secondary); border: none; cursor: pointer; white-space: nowrap; font-size: 0.75rem; font-weight: 500; flex-shrink: 0; transition: all 0.2s; }
        .tab.active { background: var(--accent-cyan); color: var(--bg-primary); }
        .tab.active-ped { background: var(--accent-pink); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .alert { padding: 0.625rem 0.75rem; border-radius: 6px; margin-bottom: 0.5rem; font-size: 0.8rem; font-weight: 500; }
        .alert-warning { background: rgba(245, 158, 11, 0.15); border-left: 3px solid var(--warning); color: var(--warning); }
        .alert-danger { background: rgba(239, 68, 68, 0.15); border-left: 3px solid var(--danger); color: #fca5a5; }
        .alert-info { background: rgba(6, 182, 212, 0.15); border-left: 3px solid var(--accent-cyan); color: var(--accent-cyan); }
        .alert-purple { background: rgba(168, 85, 247, 0.15); border-left: 3px solid var(--accent-purple); color: #c4b5fd; }
        .alerta-critico { background: rgba(239, 68, 68, 0.2); border: 2px solid var(--danger); color: #fca5a5; padding: 0.75rem; border-radius: 8px; font-weight: 700; text-align: center; margin: 0.5rem 0; font-size: 0.85rem; }
        .drug-card { background: var(--bg-card); border-radius: 8px; padding: 0.875rem; margin-bottom: 0.75rem; border-left: 4px solid var(--accent-green); }
        .drug-card .drug-name { font-weight: 700; color: var(--text-primary); font-size: 0.95rem; margin-bottom: 0.25rem; }
        .drug-card .drug-faixa { color: var(--text-secondary); font-size: 0.75rem; margin-bottom: 0.5rem; }
        .drug-card .drug-dose-destaque { color: #4ade80; font-weight: 800; font-size: 1.4rem; background: rgba(34, 197, 94, 0.1); padding: 0.625rem 0.875rem; border-radius: 6px; border-left: 4px solid var(--accent-green); margin: 0.5rem 0; letter-spacing: 0.5px; }
        .drug-card .drug-apresentacao { background: var(--apresentacao); color: #1e1e1e; font-weight: 700; padding: 0.375rem 0.625rem; border-radius: 4px; font-size: 0.8rem; display: inline-block; margin: 0.375rem 0; }
        .drug-card .drug-diluicao { color: var(--accent-cyan); font-size: 0.8rem; background: rgba(6, 182, 212, 0.1); padding: 0.5rem 0.625rem; border-radius: 4px; margin-top: 0.375rem; border: 1px solid rgba(6, 182, 212, 0.3); }
        .drug-card .drug-diluicao strong { color: #4ade80; }
        .fonte { font-size: 0.65rem; color: var(--text-secondary); font-style: italic; margin-top: 0.5rem; }
        .broselow-cinza { background: #6b7280; color: white; } .broselow-rosa { background: #ec4899; color: white; }
        .broselow-vermelho { background: #ef4444; color: white; } .broselow-roxo { background: #8b5cf6; color: white; }
        .broselow-amarelo { background: #eab308; color: #1e1e1e; } .broselow-branco { background: #f1f5f9; color: #1e1e1e; }
        .broselow-azul { background: #3b82f6; color: white; } .broselow-laranja { background: #f97316; color: white; }
        .broselow-verde { background: #22c55e; color: white; }
        .zona-badge { display: inline-block; padding: 0.25rem 0.625rem; border-radius: 4px; font-weight: 700; font-size: 0.8rem; }
        .accordion { margin-bottom: 0.5rem; }
        .accordion-header { background: var(--bg-card); padding: 0.75rem; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid var(--danger); font-weight: 600; font-size: 0.85rem; }
        .accordion-header:active { background: #3d4a5c; }
        .accordion-header.active { border-radius: 6px 6px 0 0; background: #3d4a5c; }
        .accordion-header .icon { font-size: 1rem; transition: transform 0.2s; }
        .accordion-header.active .icon { transform: rotate(180deg); }
        .accordion-content { display: none; background: var(--bg-secondary); padding: 0.75rem; border-radius: 0 0 6px 6px; border: 1px solid var(--bg-card); border-top: none; font-size: 0.8rem; }
        .accordion-content.show { display: block; }
        .accordion-content ul { margin-left: 1rem; margin-bottom: 0.5rem; }
        .accordion-content li { margin-bottom: 0.25rem; line-height: 1.4; }
        .accordion-content .dose-box { background: var(--bg-card); padding: 0.5rem; border-radius: 6px; margin: 0.5rem 0; }
        .accordion-content .dose-item { display: flex; justify-content: space-between; padding: 0.25rem 0; border-bottom: 1px solid var(--bg-primary); font-size: 0.8rem; }
        .accordion-content .dose-item:last-child { border-bottom: none; }
        .accordion-content .dose-value { color: var(--accent-green); font-weight: 600; }
        .accordion-content h5 { color: var(--accent-cyan); font-size: 0.8rem; margin: 0.5rem 0 0.375rem; font-weight: 600; }
        .accordion-header.acls { border-left-color: #ef4444; } .accordion-header.infusao { border-left-color: #8b5cf6; } .accordion-header.cardiaca { border-left-color: #f97316; }
        .sv-table { font-size: 0.75rem; } .sv-table th { background: var(--bg-card); font-size: 0.7rem; } .sv-table td { font-size: 0.75rem; }
        .sv-highlight { background: rgba(236, 72, 153, 0.15); font-weight: 600; }
        .ficha-rapida { background: var(--bg-card); padding: 0.875rem; border-radius: 8px; font-family: 'SF Mono', Monaco, 'Courier New', monospace; font-size: 0.75rem; white-space: pre-wrap; line-height: 1.5; }
        .status-ok { color: var(--success); font-weight: 700; } .status-danger { color: var(--danger); font-weight: 700; } .status-warning { color: var(--warning); font-weight: 700; }
        .fab-registro { position: fixed; bottom: 20px; right: 20px; width: 54px; height: 54px; border-radius: 50%; background: var(--accent-purple); color: white; border: none; font-size: 1.25rem; cursor: pointer; box-shadow: 0 4px 12px rgba(168, 85, 247, 0.4); z-index: 100; display: none; justify-content: center; align-items: center; }
        .fab-registro.show { display: flex; }
        .modal-registro { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: 1000; overflow-y: auto; padding: 1rem; }
        .modal-registro.active { display: block; }
        .modal-registro-content { background: var(--bg-secondary); border-radius: 12px; max-width: 480px; margin: 0 auto; padding: 1.25rem; }
        .modal-registro-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--bg-card); }
        .modal-registro-header h3 { color: var(--accent-purple); font-size: 1rem; }
        .close-modal-reg { font-size: 1.5rem; color: var(--text-secondary); cursor: pointer; background: none; border: none; width: auto; padding: 0; }
        .registro-section { margin-bottom: 1rem; } .registro-section h4 { color: var(--accent-cyan); font-size: 0.85rem; margin-bottom: 0.5rem; }
        .registro-input-row { display: flex; gap: 0.375rem; margin-bottom: 0.375rem; }
        .registro-input-row select, .registro-input-row input { padding: 0.5rem; font-size: 0.85rem; }
        .registro-input-row select { flex: 2; } .registro-input-row input { flex: 1; }
        .registro-input-row button { width: auto; padding: 0.5rem 0.875rem; font-size: 0.85rem; background: var(--accent-green); color: white; }
        .registro-lista { background: var(--bg-card); border-radius: 6px; padding: 0.5rem; max-height: 130px; overflow-y: auto; }
        .registro-item { display: flex; justify-content: space-between; align-items: center; padding: 0.375rem; border-bottom: 1px solid var(--bg-primary); font-size: 0.8rem; }
        .registro-item:last-child { border-bottom: none; }
        .registro-item .del-btn { background: var(--danger); color: white; border: none; border-radius: 4px; padding: 0.2rem 0.5rem; cursor: pointer; font-size: 0.7rem; width: auto; }
        .registro-totais { background: var(--bg-card); padding: 0.625rem; border-radius: 6px; margin-top: 0.75rem; }
        .registro-totais p { font-size: 0.85rem; margin-bottom: 0.25rem; } .registro-totais .valor { color: var(--accent-green); font-weight: 700; }
        .registro-actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; } .registro-actions button { flex: 1; padding: 0.625rem; font-size: 0.85rem; }
        .btn-exportar { background: var(--accent-cyan); color: var(--bg-primary); } .btn-limpar { background: var(--danger); color: white; }
        .footer { margin-top: 1.5rem; padding: 1.25rem; text-align: center; border-top: 1px solid var(--bg-card); }
        .dev-name { font-size: 0.7rem; color: var(--text-secondary); } .dev-title { font-size: 0.9rem; font-weight: 600; color: var(--accent-cyan); margin: 0.25rem 0; }
        .dev-institution { font-size: 0.75rem; color: var(--text-secondary); }
        .coffee-btn { display: inline-block; padding: 0.625rem 1.25rem; background: linear-gradient(90deg, #f59e0b, #f97316); color: var(--bg-primary); border-radius: 20px; font-weight: 600; font-size: 0.85rem; cursor: pointer; border: none; margin: 0.875rem 0; }
        .version { font-size: 0.65rem; color: var(--bg-card); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--bg-secondary); padding: 1.5rem; border-radius: 12px; max-width: 90%; width: 320px; text-align: center; position: relative; }
        .modal-content h3 { color: var(--accent-cyan); margin-bottom: 0.5rem; }
        .close-modal { position: absolute; top: 0.75rem; right: 0.75rem; font-size: 1.25rem; color: var(--text-secondary); cursor: pointer; }
        .pix-info { background: var(--bg-card); padding: 0.875rem; border-radius: 8px; margin: 0.875rem 0; }
        .pix-key { font-family: monospace; font-size: 0.9rem; color: var(--accent-green); margin: 0.5rem 0; }
        .btn-copy { background: var(--accent-cyan); color: var(--bg-primary); border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600; width: auto; }
        @media (max-width: 600px) {
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
            table { font-size: 0.75rem; } th, td { padding: 0.375rem 0.25rem; }
            .drug-card .drug-dose-destaque { font-size: 1.25rem; } .stats-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header id="main-header">
            <h1>Calculadora Anestésica PRO</h1>
            <p>Adulto &amp; Pediátrico • Baseada em Evidências</p>
        </header>
            <script>
        // ==================== SERVICE WORKER ====================
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => { reg.update(); }).catch(() => {});
        }

        // ==================== VARIÁVEIS GLOBAIS ====================
        let modoAtual = 'adulto';
        let pesoAtualGlobal = 0;
        let pesoPed = 0;
        let idadeTotalMesesGlobal = 0;
        let registroDrogas = [];
        let registroFluidos = [];

        // ==================== MODO SELECTOR ====================
        function setModo(modo) {
            modoAtual = modo;
            const header = document.getElementById('main-header');
            document.getElementById('btn-modo-adulto').classList.remove('active-adulto');
            document.getElementById('btn-modo-ped').classList.remove('active-ped');
            if (modo === 'adulto') {
                document.getElementById('btn-modo-adulto').classList.add('active-adulto');
                document.getElementById('form-adulto').style.display = 'block';
                document.getElementById('form-ped').style.display = 'none';
                header.classList.remove('ped-mode');
            } else {
                document.getElementById('btn-modo-ped').classList.add('active-ped');
                document.getElementById('form-adulto').style.display = 'none';
                document.getElementById('form-ped').style.display = 'block';
                header.classList.add('ped-mode');
            }
        }

        // ==================== PIX MODAL ====================
        function showPix() { document.getElementById('pix-modal').classList.add('active'); }
        function closePix() { document.getElementById('pix-modal').classList.remove('active'); }
        function copyPix() {
            const pixKey = document.getElementById('pix-key').innerText;
            navigator.clipboard.writeText(pixKey).then(() => {
                const btn = document.querySelector('.btn-copy');
                btn.innerHTML = '✓ Copiado!';
                setTimeout(() => { btn.innerHTML = 'Copiar Chave'; }, 2000);
            });
        }

        // ==================== REGISTRO MODAL ====================
        function openRegistro() { document.getElementById('modal-registro').classList.add('active'); }
        function closeRegistro() { document.getElementById('modal-registro').classList.remove('active'); }

        function addDroga() {
            const droga = document.getElementById('reg-droga').value;
            const dose = document.getElementById('reg-dose').value;
            if (!droga || !dose) return;
            const hora = new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'});
            registroDrogas.push({ droga, dose, hora });
            renderDrogas();
            document.getElementById('reg-droga').value = '';
            document.getElementById('reg-dose').value = '';
        }
        function renderDrogas() {
            const lista = document.getElementById('lista-drogas');
            if (!lista) return;
            if (registroDrogas.length === 0) {
                lista.innerHTML = '<p style="color: var(--text-secondary); font-size: 0.75rem; text-align: center; padding: 0.5rem;">Nenhuma droga registrada</p>';
                return;
            }
            lista.innerHTML = registroDrogas.map((d, i) => `
                <div class="registro-item">
                    <span>${d.droga}: ${d.dose} (${d.hora})</span>
                    <button class="del-btn" onclick="delDroga(${i})">×</button>
                </div>`).join('');
        }
        function delDroga(i) { registroDrogas.splice(i, 1); renderDrogas(); }

        function addFluido() {
            const fluido = document.getElementById('reg-fluido').value;
            const volume = document.getElementById('reg-volume').value;
            if (!fluido || !volume) return;
            registroFluidos.push({ fluido, volume: parseFloat(volume) });
            renderFluidos();
            document.getElementById('reg-fluido').value = '';
            document.getElementById('reg-volume').value = '';
        }
        function renderFluidos() {
            const lista = document.getElementById('lista-fluidos');
            if (!lista) return;
            if (registroFluidos.length === 0) {
                lista.innerHTML = '<p style="color: var(--text-secondary); font-size: 0.75rem; text-align: center; padding: 0.5rem;">Nenhum fluido registrado</p>';
                calcularTotaisFluidos();
                return;
            }
            lista.innerHTML = registroFluidos.map((f, i) => `
                <div class="registro-item">
                    <span>${f.fluido}: ${f.volume} ml</span>
                    <button class="del-btn" onclick="delFluido(${i})">×</button>
                </div>`).join('');
            calcularTotaisFluidos();
        }
        function delFluido(i) { registroFluidos.splice(i, 1); renderFluidos(); }
        function calcularTotaisFluidos() {
            let cristaloide = 0, hemo = 0;
            registroFluidos.forEach(f => {
                if (['SF 0,9%', 'Ringer Lactato', 'Plasma-Lyte'].includes(f.fluido)) cristaloide += f.volume;
                else hemo += f.volume;
            });
            document.getElementById('total-cristaloide').textContent = `${cristaloide} ml`;
            document.getElementById('total-hemo').textContent = `${hemo} ml`;
            const pesoAtual = modoAtual === 'adulto' ? pesoAtualGlobal : pesoPed;
            if (pesoAtual > 0) document.getElementById('cristaloide-mlkg').textContent = `(${(cristaloide / pesoAtual).toFixed(1)} ml/kg)`;
        }
        function exportarRegistro() {
            const nome = modoAtual === 'adulto' ? document.getElementById('nome').value : document.getElementById('nome-ped').value;
            const pesoAtual = modoAtual === 'adulto' ? pesoAtualGlobal : pesoPed;
            let texto = `REGISTRO DE ANESTESIA\n========================\n`;
            texto += `Paciente: ${nome || 'Não informado'}\nPeso: ${pesoAtual} kg\nModo: ${modoAtual.toUpperCase()}\nData: ${new Date().toLocaleDateString('pt-BR')}\n\n`;
            texto += `DROGAS ADMINISTRADAS\n------------------------\n`;
            if (registroDrogas.length === 0) texto += `Nenhuma droga registrada\n`;
            else registroDrogas.forEach(d => { texto += `${d.hora} - ${d.droga}: ${d.dose}\n`; });
            texto += `\nFLUIDOS ADMINISTRADOS\n------------------------\n`;
            if (registroFluidos.length === 0) texto += `Nenhum fluido registrado\n`;
            else registroFluidos.forEach(f => { texto += `${f.fluido}: ${f.volume} ml\n`; });
            texto += `\nTOTAIS\n------------------------\n`;
            texto += `Cristaloide: ${document.getElementById('total-cristaloide').textContent}\n`;
            texto += `Hemoderivados: ${document.getElementById('total-hemo').textContent}\n`;
            navigator.clipboard.writeText(texto).then(() => { alert('Registro copiado para a área de transferência!'); });
        }
        function limparRegistro() {
            if (confirm('Limpar todo o registro?')) {
                registroDrogas = []; registroFluidos = [];
                renderDrogas(); renderFluidos();
            }
        }

        // ==================== ACCORDION ====================
        function toggleAccordion(element) {
            const content = element.nextElementSibling;
            const isActive = element.classList.contains('active');

        // ==================== CALCULADORA ADULTO ====================
        function calcular() {
            const nome = document.getElementById('nome').value || 'Paciente';
            const peso = parseFloat(document.getElementById('peso').value);
            const altura = parseFloat(document.getElementById('altura').value);
            const sexo = document.getElementById('sexo').value;
            const idade = parseInt(document.getElementById('idade').value);
            const asa = document.getElementById('asa').value;
            if (!peso || !altura || !idade) { alert('Preencha todos os campos obrigatórios!'); return; }
            pesoAtualGlobal = peso;

            const tbw = peso;
            const imc = (peso / Math.pow(altura / 100, 2)).toFixed(1);
            const imc_num = parseFloat(imc);
            const ibw = Math.round(22 * Math.pow(altura / 100, 2) * 10) / 10;
            let pbw = sexo === 'M' ? Math.round((50 + 0.91 * (altura - 152.4)) * 10) / 10 : Math.round((45.5 + 0.91 * (altura - 152.4)) * 10) / 10;
            let lbw = sexo === 'M' ? Math.round((9270 * peso) / (6680 + 216 * imc_num) * 10) / 10 : Math.round((9270 * peso) / (8780 + 244 * imc_num) * 10) / 10;
            const abw = Math.round((ibw + 0.4 * (peso - ibw)) * 10) / 10;

            const eh_baixo_peso = imc_num < 18.5;
            const eh_normopeso = imc_num >= 18.5 && imc_num < 25;
            const eh_sobrepeso = imc_num >= 25 && imc_num < 30;
            const eh_obeso_classe1 = imc_num >= 30 && imc_num < 35;
            const eh_obeso_classe2 = imc_num >= 35 && imc_num < 40;
            const eh_obeso_morbido = imc_num >= 40;

            let classificacao;
            if (eh_baixo_peso) classificacao = 'BAIXO PESO';
            else if (eh_normopeso) classificacao = 'NORMAL';
            else if (eh_sobrepeso) classificacao = 'SOBREPESO';
            else if (eh_obeso_classe1) classificacao = 'OBESO CL.1';
            else if (eh_obeso_classe2) classificacao = 'OBESO CL.2';
            else classificacao = 'OBESO MÓRB.';

            let peso_escalonado, peso_tipo;
            if (eh_normopeso || eh_baixo_peso || eh_sobrepeso) { peso_escalonado = tbw; peso_tipo = 'TBW'; }
            else if (eh_obeso_classe1) { peso_escalonado = abw; peso_tipo = 'ABW'; }
            else { peso_escalonado = lbw; peso_tipo = 'LBW'; }

            let remi_peso, remi_tipo;

            else if (eh_sobrepeso || eh_obeso_classe1) { remi_peso = abw; remi_tipo = 'ABW'; }
            else { remi_peso = lbw; remi_tipo = 'LBW'; }

            let sufenta_peso_tci = peso_escalonado;
            let sufenta_tipo_tci = peso_tipo;

            const doses = {
                propofol: Math.round(peso_escalonado * 2),
                propofol_sed: Math.round(peso_escalonado * 0.5),
                etomidato: Math.round(peso_escalonado * 0.3 * 10) / 10,
                cetamina: Math.round(tbw * 1.5),
                midazolam: (tbw * 0.05).toFixed(1),
                rocuronio: Math.round(peso_escalonado * 0.6),
                rocuronio_isr: Math.round(peso_escalonado * 1.2),
                atracurio: Math.round(peso_escalonado * 0.5),
                cisatracurio: (peso_escalonado * 0.15).toFixed(1),
                succinilcolina: Math.round(tbw * 1),
                fentanil: Math.round(peso_escalonado * 3),
                fentanil_max: Math.round(peso_escalonado * 5),
                sufentanil: (peso_escalonado * 0.3).toFixed(1),
                sufentanil_max: (peso_escalonado * 0.5).toFixed(1),
                sufentanil_manut_min: (sufenta_peso_tci * 0.3).toFixed(1),
                sufentanil_manut_max: (sufenta_peso_tci * 0.6).toFixed(1),
                remifentanil_min: (remi_peso * 0.1).toFixed(2),
                remifentanil_max: (remi_peso * 0.3).toFixed(2),
                morfina: (peso_escalonado * 0.1).toFixed(1),
                neostigmina: (tbw * 0.04).toFixed(1),
                neostigmina_max: (tbw * 0.07).toFixed(1),
                atropina: (tbw * 0.02).toFixed(1),
                sugammadex_2: Math.round(tbw * 2),
                sugammadex_4: Math.round(tbw * 4),
                dantrolene: (tbw * 2.5).toFixed(1),
                dantrolene_frascos: Math.ceil((tbw * 2.5) / 20),
                txa: Math.round(tbw * 30),
                txa_max: Math.round(tbw * 50),
                lipid_bolus: Math.round(lbw * 1.5),
                lipid_inf: (lbw * 0.25).toFixed(1),
                bupi_max: Math.round(ibw * 2),
                lido_max: Math.round(ibw * 4.5),
                lido_max_adr: Math.round(ibw * 7),
                ropi_max: Math.round(ibw * 3),
                vc_min: Math.round(pbw * 6),
                vc_max: Math.round(pbw * 8),
                magica_cetamina_ind: (tbw * 0.2).toFixed(1),
                magica_dex_ind: (tbw * 0.5).toFixed(1),
                magica_lido_ind: Math.round(tbw * 1),
                magica_mg_ind: Math.round(tbw * 30),
                magica_cetamina_manut: Math.round(tbw * 0.2 * 4),
                magica_dex_manut: Math.round(tbw * 0.5 * 4),
                magica_lido_manut: Math.round(tbw * 1 * 4),
                magica_mg_manut: Math.round(tbw * 10 * 4)
            };

            const lido_mgkg = (doses.magica_lido_manut / tbw).toFixed(1);
            const lido_status = (doses.magica_lido_manut / tbw) > 4 ? 'danger' : 'ok';

            const remi_mlh_med = (remi_peso * 0.2 * 60 / 8).toFixed(1);
            const remi_mlh_max = (remi_peso * 0.3 * 60 / 8).toFixed(1);

                    <button onclick="addDroga()">+</button>
                </div>
                <div class="registro-lista" id="lista-drogas">
                    <p style="color: var(--text-secondary); font-size: 0.75rem; text-align: center; padding: 0.5rem;">Nenhuma droga registrada</p>
                </div>
            </div>
            <div class="registro-section">
                <h4>Fluidos</h4>
                <div class="registro-input-row">
                    <select id="reg-fluido">
                        <option value="">Selecione...</option>
                        <option value="SF 0,9%">SF 0,9%</option>
                        <option value="Ringer Lactato">Ringer Lactato</option>
                        <option value="Plasma-Lyte">Plasma-Lyte</option>
                        <option value="Concentrado Hemácias">Conc. Hemácias</option>
                        <option value="Plaquetas">Plaquetas</option>
                        <option value="Plasma Fresco">Plasma Fresco</option>
                        <option value="Crioprecipitado">Crioprecipitado</option>
                    </select>
                    <input type="number" id="reg-volume" placeholder="mL">
                    <button onclick="addFluido()">+</button>
                </div>
                <div class="registro-lista" id="lista-fluidos">
                    <p style="color: var(--text-secondary); font-size: 0.75rem; text-align: center; padding: 0.5rem;">Nenhum fluido registrado</p>
                </div>
            </div>
            <div class="registro-totais">
                <p><strong>Cristaloide:</strong> <span class="valor" id="total-cristaloide">0 ml</span> <span id="cristaloide-mlkg"></span></p>
                <p><strong>Hemoderivados:</strong> <span class="valor" id="total-hemo">0 ml</span></p>
            </div>
            <div class="registro-actions">
                <button class="btn-exportar" onclick="exportarRegistro()">Exportar</button>
                <button class="btn-limpar" onclick="limparRegistro()">Limpar</button>
            </div>
        </div>
    </div>

    <!-- MODAL PIX -->
    <div id="pix-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closePix()">×</span>
            <h3>Me pague um café</h3>
            <p style="font-size: 0.85rem; color: var(--text-secondary);">Obrigado por usar a calculadora!</p>
            <div class="pix-info">
                <p><strong>Chave PIX:</strong></p>
                <p class="pix-key" id="pix-key">ahmf1204@gmail.com</p>
                <button class="btn-copy" onclick="copyPix()">Copiar Chave</button>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', function() {
            var pm = document.getElementById('pix-modal');
            if (pm) pm.addEventListener('click', function(e) { if (e.target === this) closePix(); });
            renderDrogas();
            renderFluidos();
        });
    </script>
</body>
</html>
