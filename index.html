        :root {

            --bg-card: #334155;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-purple: #a855f7;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 1rem;
            padding-bottom: 2rem;
        }
        
        .container { max-width: 800px; margin: 0 auto; }
        
        header {
            text-align: center;
            padding: 1rem 0 2rem;
            border-bottom: 2px solid;
            border-image: linear-gradient(90deg, var(--accent-cyan), var(--accent-green)) 1;
            margin-bottom: 2rem;
        }
        
        header h1 {
            font-size: 1.5rem;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        header p { color: var(--text-secondary); font-size: 0.875rem; margin-top: 0.5rem; }
        
        .card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        
        .card h2 {
            font-size: 1rem;
            color: var(--accent-cyan);
            margin-bottom: 1rem;
        }
        
        .form-group { margin-bottom: 1rem; }
        
        label { display: block; font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 0.5rem; }
        
        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--bg-card);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
        }
        
        input:focus, select:focus { outline: none; border-color: var(--accent-cyan); }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
        
        button {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
            color: var(--bg-primary);
        }
        
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3); }
        
        .btn-secondary { background: var(--bg-card); color: var(--text-primary); margin-top: 0.5rem; }
        
        #results { display: none; }
        
        .result-section {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
